; Discover en production. Un envoi arrive par morceaux de 1 Mo (B30) ; une photo de
; profil ou un apercu peut peser davantage : 64 Mo laissent de la marge.
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
expose_php = Off

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.validate_timestamps = 0
