name: discover
description: "Discover : des lieux en vraies photos, et l'itinéraire pour y aller."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  go_router: ^18.1.1
  http: ^1.6.0
  image_picker: ^1.2.4
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icones/
    - assets/images/
    - assets/logo/

  fonts:
    - family: WuraMi
      fonts:
        - asset: assets/polices/WuraMi-Light.ttf
          weight: 300
        - asset: assets/polices/WuraMi.ttf
          weight: 400
        - asset: assets/polices/WuraMi-SemiBold.ttf
          weight: 600
        - asset: assets/polices/WuraMi-Bold.ttf
          weight: 700
